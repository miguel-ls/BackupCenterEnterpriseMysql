services:
  backupcenter-sandbox:

    container_name: backupcenter-sandbox

    build:
      context: .
      dockerfile: docker/Dockerfile

    image: backupcenter:sandbox

    ports:
      - "8087:80"

    volumes:
      - ./:/var/www/html

      - /mnt/Interno3TB/BackupsSQL:/backups

    restart: unless-stopped

  sqliteweb-sandbox:

    image: coleifer/sqlite-web

    container_name: sqliteweb-sandbox

    ports:
      - "8089:8080"

    volumes:
      - ./storage/database:/data

    command: sqlite_web /data/backupcenter.db --host 0.0.0.0

    restart: unless-stopped
